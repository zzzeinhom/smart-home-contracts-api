spring:
  application:
    name: contracts-mcp-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contracts_db}
    username: ${DB_USER:${DB_USERNAME:app_user}}
    password: ${DB_PASSWORD:app_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.example.com}
      api-key: ${AI_API_KEY:changeme}
      # Override AI_EMBEDDINGS_PATH=/embeddings if AI_BASE_URL already includes /v1.
      embedding:
        embeddings-path: ${AI_EMBEDDINGS_PATH:/v1/embeddings}
        options:
          model: ${AI_EMBEDDING_MODEL:embedding-model}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    mcp:
      server:
        name: smart-home-operations-mcp
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

server:
  port: ${MCP_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

name: Smart Home Contracts API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit & Testcontainers Integration Tests
        run: mvn -B test

      - name: Verify Multi-Stage Docker Image Builds
        run: |
          docker build -f contracts-app/Dockerfile -t smart-home-contracts-app:ci .
          docker build -f contracts-mcp-server/Dockerfile -t smart-home-contracts-mcp:ci .
